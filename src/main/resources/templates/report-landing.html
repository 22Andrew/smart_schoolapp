<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Reports - Smart School</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/report-landing.css}">
    <link rel="stylesheet" th:href="@{/css/app-theme.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav th:replace="~{fragments/top-navbar :: top-navbar}"></nav>

    <div class="main-container">
        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <main class="main-content report-landing-page">
            <section class="report-landing-card">
                <div class="report-landing-card-header" th:text="${landingTitle}">Report</div>
                <div class="report-landing-card-body">
                    <div class="report-landing-grid">
                        <a th:each="item : ${landingItems}"
                           th:href="${item.urlPath != null ? item.urlPath : landingPath + '/' + item.key}"
                           class="report-landing-link">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                            <span th:text="${item.title}">Report</span>
                        </a>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
