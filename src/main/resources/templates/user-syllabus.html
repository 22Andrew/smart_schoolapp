<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{fragments/user-layout :: layout(~{::title}, ~{::#user-syllabus-page})}">
<head>
    <title th:text="|${schoolName} - Lesson Plan|">Mount Carmel School - Lesson Plan</title>
</head>
<body>
<div id="user-syllabus-page" class="usy-page">
    <link rel="stylesheet" th:href="@{/css/user-syllabus.css}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <div class="usy-card">
        <div class="usy-header">
            <h1 class="usy-title">Lesson Plan</h1>
            <div class="usy-week-nav">
                <button type="button" class="usy-week-btn" id="usyPrevWeekBtn" aria-label="Previous week">&lt;</button>
                <div class="usy-week-range" id="usyWeekRangeLabel">08/24/2026 To 08/30/2026</div>
                <button type="button" class="usy-week-btn" id="usyNextWeekBtn" aria-label="Next week">&gt;</button>
            </div>
        </div>

        <div class="usy-grid" id="usyGrid">
            <div class="usy-loading">Loading lesson plan...</div>
        </div>
    </div>

    <div class="usy-view-modal" id="usyViewModal" hidden>
        <div class="usy-view-overlay" id="usyViewOverlay"></div>
        <div class="usy-view-dialog" role="dialog" aria-modal="true" aria-labelledby="usyViewTitle">
            <div class="usy-view-header">
                <h2 id="usyViewTitle">Lesson Plan</h2>
                <button type="button" class="usy-view-close" id="usyViewClose" aria-label="Close">&times;</button>
            </div>
            <div class="usy-view-body">
                <div class="usy-view-left">
                    <div class="usy-view-toolbar">
                        <h3>Lesson Plan</h3>
                        <div class="usy-view-actions">
                            <button type="button" class="usy-icon-btn" id="usyPrintBtn" title="Print">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="6 9 6 2 18 2 18 9"></polyline>
                                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                                    <rect x="6" y="14" width="12" height="8"></rect>
                                </svg>
                            </button>
                            <button type="button" class="usy-icon-btn" id="usyExcelBtn" title="Excel">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="usy-detail-table" id="usyDetailTable"></div>
                </div>
                <div class="usy-view-right">
                    <h3>Comments</h3>
                    <div class="usy-comment-form">
                        <input type="text" id="usyCommentInput" class="usy-comment-input" placeholder="Type your comment" autocomplete="off">
                        <button type="button" class="usy-comment-send" id="usySendCommentBtn">Send</button>
                    </div>
                    <div class="usy-comment-list" id="usyCommentList"></div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/user-syllabus.js}"></script>
</div>
</body>
</html>
