<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{fragments/user-layout :: layout(~{::title}, ~{::#user-cbse-timetable-page})}">
<head>
    <title th:text="|${schoolName} - CBSE Exam Timetable|">Mount Carmel School - CBSE Exam Timetable</title>
</head>
<body>
<div id="user-cbse-timetable-page" class="ugm-page uct-page">
    <link rel="stylesheet" th:href="@{/css/user-gmeet.css}">
    <link rel="stylesheet" th:href="@{/css/user-cbse-timetable.css}">

    <div class="ugm-card uct-card">
        <div class="uct-toolbar">
            <h1 class="ugm-title">CBSE Exam Timetable</h1>
            <button type="button" class="uct-print-btn" id="uctPrintBtn" title="Print">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 6 2 18 2 18 9"></polyline>
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                    <rect x="6" y="14" width="12" height="8"></rect>
                </svg>
            </button>
        </div>

        <div class="uct-panels" id="uctPanels">
            <p class="uct-empty">Loading CBSE exam timetable...</p>
        </div>
    </div>

    <script th:src="@{/js/user-cbse-timetable.js}"></script>
</div>
</body>
</html>
