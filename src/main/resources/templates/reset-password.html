<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${schoolName} + ' - Reset Password'">Mount Carmel School - Reset Password</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/app-theme.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="user-login-page">
    <div class="login-container">
        <div class="login-left">
            <div class="login-form-wrapper">
                <div class="logo-section">
                    <div class="logo-container user-login-logo">
                        <div class="logo-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
                                <defs>
                                    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" style="stop-color:#f6c544;stop-opacity:1" />
                                        <stop offset="100%" style="stop-color:#f39c12;stop-opacity:1" />
                                    </linearGradient>
                                </defs>
                                <rect x="8" y="10" width="34" height="32" fill="url(#bookGradient)" rx="2"/>
                                <rect x="10" y="12" width="30" height="28" fill="#f39c12" rx="1"/>
                                <path d="M 25 12 L 25 40" stroke="#f6c544" stroke-width="2"/>
                                <polygon points="15,20 35,20 25,15" fill="#2d3748"/>
                                <rect x="24" y="20" width="2" height="8" fill="#2d3748"/>
                                <circle cx="26" cy="29" r="1.5" fill="#e74c3c"/>
                            </svg>
                        </div>
                        <div class="logo-text">SMART SCHOOL</div>
                    </div>
                </div>

                <h2 class="login-title">Reset Password</h2>

                <div th:if="${errorMessage}" class="login-alert login-alert-error" th:text="${errorMessage}">
                    Error message
                </div>

                <form class="login-form" th:action="@{/site/resetpassword/{token}(token=${token})}" method="post">
                    <div class="form-group">
                        <input type="password"
                               class="form-control"
                               name="password"
                               placeholder="New Password"
                               autocomplete="new-password"
                               minlength="6"
                               required>
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                    </div>

                    <div class="form-group">
                        <input type="password"
                               class="form-control"
                               name="confirmPassword"
                               placeholder="Confirm Password"
                               autocomplete="new-password"
                               minlength="6"
                               required>
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                    </div>

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <button type="submit" class="btn-signin">Submit</button>
                </form>

                <div class="login-footer">
                    <a href="/site/login" class="footer-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                            <polyline points="10 17 15 12 10 7"></polyline>
                            <line x1="15" y1="12" x2="3" y2="12"></line>
                        </svg>
                        Back to Login
                    </a>
                </div>
            </div>
        </div>

        <div class="login-right user-login-right">
            <div class="news-overlay">
                <h2 class="news-title" th:text="|What's New In ${schoolName}|">What's New In Mount Carmel School</h2>
                <div class="news-items">
                    <div class="news-item" th:each="item : ${newsItems}">
                        <h3 class="news-item-title" th:text="${item.title}">News title</h3>
                        <p class="news-item-text" th:text="${item.description}">News description</p>
                        <a href="#" class="news-read-more">Read More</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/app-branding.js}"></script>
</body>
</html>
