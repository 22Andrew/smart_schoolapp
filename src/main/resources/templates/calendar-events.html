<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - Smart School</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/calendar-events.css}">
    <link rel="stylesheet" th:href="@{/css/app-theme.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <nav th:replace="~{fragments/top-navbar :: top-navbar}"></nav>

    <div class="main-container">
        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <main class="main-content cal-page">
            <div class="cal-layout">
                <section class="cal-main-panel">
                    <div class="cal-toolbar">
                        <div class="cal-toolbar-left">
                            <button type="button" class="cal-nav-btn" id="prevBtn" aria-label="Previous">&lsaquo;</button>
                            <button type="button" class="cal-nav-btn" id="nextBtn" aria-label="Next">&rsaquo;</button>
                            <button type="button" class="cal-today-btn" id="todayBtn">Today</button>
                        </div>
                        <div class="cal-title" id="calendarTitle">August 2026</div>
                        <div class="cal-view-tabs">
                            <button type="button" class="cal-view-tab active" data-view="month">Month</button>
                            <button type="button" class="cal-view-tab" data-view="week">Week</button>
                            <button type="button" class="cal-view-tab" data-view="day">Day</button>
                        </div>
                    </div>

                    <div class="cal-month-view" id="monthView">
                        <div class="cal-weekdays">
                            <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
                        </div>
                        <div class="cal-month-grid" id="monthDaysGrid"></div>
                    </div>

                    <div class="cal-week-view" id="weekView" hidden>
                        <div class="cal-placeholder">Week view coming soon.</div>
                    </div>
                    <div class="cal-day-view" id="dayView" hidden>
                        <div class="cal-placeholder">Day view coming soon.</div>
                    </div>
                </section>

                <aside class="cal-todo-panel">
                    <div class="cal-todo-header">
                        <h2>To Do List</h2>
                        <button type="button" class="cal-todo-add-btn" id="addTodoBtn" title="Add To Do">
                            <span class="cal-todo-add-icon">+</span>
                        </button>
                    </div>
                    <div class="cal-todo-list" id="todoList"></div>
                    <div class="cal-todo-pagination" id="todoPagination"></div>
                </aside>
            </div>
        </main>
    </div>

    <div class="cal-task-modal-backdrop" id="taskModal" hidden>
        <div class="cal-task-modal" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
            <div class="cal-task-modal-header">
                <h3 id="taskModalTitle">Add Task</h3>
                <button type="button" class="cal-task-modal-close" id="closeTaskModal" aria-label="Close">&times;</button>
            </div>
            <form class="cal-task-modal-body" id="taskModalForm">
                <div class="cal-task-field">
                    <label for="taskTitleInput">Task Title <span class="required">*</span></label>
                    <input type="text" id="taskTitleInput" name="title" autocomplete="off" required>
                </div>
                <div class="cal-task-field">
                    <label for="taskDateInput">Date <span class="required">*</span></label>
                    <input type="text" id="taskDateInput" name="dueDate" placeholder="MM/DD/YYYY" autocomplete="off" required>
                </div>
                <div class="cal-task-modal-footer">
                    <button type="submit" class="cal-task-save-btn" id="saveTaskBtn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/dashboard.js(v=20260903-3)}"></script>
    <script th:src="@{/js/calendar-events.js}"></script>
</body>
</html>
