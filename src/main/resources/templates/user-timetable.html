<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{fragments/user-layout :: layout(~{::title}, ~{::#user-timetable-page})}">
<head>
    <title th:text="|${schoolName} - Class Timetable|">Mount Carmel School - Class Timetable</title>
</head>
<body>
<div id="user-timetable-page" class="utt-page">
    <link rel="stylesheet" th:href="@{/css/user-timetable.css}">

    <div class="utt-card">
        <div class="utt-header">
            <h1 class="utt-title">Class Timetable</h1>
            <button type="button" class="icon-action-btn utt-print-btn" id="uttPrintBtn" title="Print">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 6 2 18 2 18 9"></polyline>
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                    <rect x="6" y="14" width="12" height="8"></rect>
                </svg>
            </button>
        </div>

        <div class="utt-grid" id="uttGrid">
            <div class="utt-loading">Loading timetable...</div>
        </div>
    </div>

    <script th:src="@{/js/user-timetable.js}"></script>
</div>
</body>
</html>
