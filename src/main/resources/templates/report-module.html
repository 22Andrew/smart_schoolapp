<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Reports - Smart School</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/report-module.css}">
    <link rel="stylesheet" th:href="@{/css/app-theme.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <nav th:replace="~{fragments/top-navbar :: top-navbar}"></nav>

    <div class="main-container">
        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <main class="main-content report-module-page" id="reportPageRoot"
              th:attr="data-category=${categorySlug},data-report-type=${activeReport},data-api-url=${apiUrl},data-show-class-section=${showClassSection},data-show-date-range=${showDateRange},data-needs-search=${needsSearch},data-show-student-filters=${categorySlug == 'studentinformation' and showClassSection},data-show-staff-attendance-criteria=${showStaffAttendanceCriteria},data-show-staff-day-wise-criteria=${showStaffDayWiseCriteria},data-show-online-exam-criteria=${showOnlineExamCriteria},data-show-online-exam-date-criteria=${showOnlineExamDateCriteria},data-show-finance-search-type-criteria=${showFinanceSearchTypeCriteria},data-show-finance-collection-criteria=${showFinanceCollectionCriteria},data-show-finance-fees-statement-criteria=${showFinanceFeesStatementCriteria},data-show-finance-income-head-criteria=${showFinanceIncomeHeadCriteria},data-show-finance-expense-head-criteria=${showFinanceExpenseHeadCriteria}">
            <div class="reports-nav-panel">
                <h2 class="section-title" th:text="${categoryTitle}">Reports</h2>
                <div class="reports-nav-grid">
                    <th:block th:if="${navItems != null}">
                        <a th:each="nav : ${navItems}"
                           th:href="${nav.urlPath != null ? nav.urlPath : reportBasePath + '/' + nav.key}"
                           class="report-nav-item"
                           th:classappend="${activeReport == nav.key} ? ' active'">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                            <span th:text="${nav.title}">Report</span>
                        </a>
                    </th:block>
                    <th:block th:unless="${navItems != null}">
                        <a th:each="report : ${reports}"
                           th:href="@{${reportBasePath} + '/' + ${report.key}}"
                           class="report-nav-item"
                           th:classappend="${activeReport == report.key} ? ' active'">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                            <span th:text="${report.title}">Report</span>
                        </a>
                    </th:block>
                </div>
            </div>

            <div class="criteria-section" th:if="${showClassSection or showDateRange or showStaffAttendanceCriteria or showStaffDayWiseCriteria or showOnlineExamCriteria or showOnlineExamDateCriteria or showFinanceSearchTypeCriteria or showFinanceCollectionCriteria or showFinanceFeesStatementCriteria or showFinanceIncomeHeadCriteria or showFinanceExpenseHeadCriteria}">
                <h2 class="section-title">Select Criteria</h2>
                <form class="criteria-form" id="criteriaForm"
                      th:classappend="${showFinanceCollectionCriteria ? ' criteria-form--finance-collection' : (showFinanceFeesStatementCriteria ? ' criteria-form--finance-fees-statement' : ((showFinanceIncomeHeadCriteria or showFinanceExpenseHeadCriteria) ? ' criteria-form--finance-head' : (showFinanceSearchTypeCriteria ? ' criteria-form--finance-search-type' : (showStaffAttendanceCriteria ? ' criteria-form--staff-attendance' : (showStaffDayWiseCriteria ? ' criteria-form--staff-day-wise' : (showOnlineExamDateCriteria and !showOnlineExamCriteria ? ' criteria-form--online-exam-date-only' : (showOnlineExamCriteria ? ' criteria-form--online-exam' : '')))))))}">
                    <div class="criteria-row">
                        <div class="form-group" th:if="${showFinanceSearchTypeCriteria}">
                            <label for="financeSearchType">Search Type <span class="required-mark">*</span></label>
                            <select id="financeSearchType" class="form-select">
                                <option value="">Select</option>
                                <option value="today">Today</option>
                                <option value="this_week">This Week</option>
                                <option value="this_month">This Month</option>
                                <option value="this_year">This Year</option>
                                <option value="last_month">Last Month</option>
                                <option value="all">All</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${showFinanceCollectionCriteria}">
                            <label for="financeSearchDuration">Search Duration <span class="required-mark">*</span></label>
                            <select id="financeSearchDuration" class="form-select">
                                <option value="">Select</option>
                                <option value="today">Today</option>
                                <option value="this_week">This Week</option>
                                <option value="this_month">This Month</option>
                                <option value="this_year">This Year</option>
                                <option value="last_month">Last Month</option>
                                <option value="all">All</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${showFinanceCollectionCriteria or showFinanceFeesStatementCriteria}">
                            <label for="classSelect">Class</label>
                            <select id="classSelect" class="form-select">
                                <option value="">Select</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${showFinanceCollectionCriteria or showFinanceFeesStatementCriteria}">
                            <label for="sectionSelect">Section</label>
                            <select id="sectionSelect" class="form-select">
                                <option value="">Select</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${showFinanceCollectionCriteria}">
                            <label for="financeFeeTypeSelect">Fees Type</label>
                            <select id="financeFeeTypeSelect" class="form-select">
                                <option value="">Select</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${showFinanceCollectionCriteria}">
                            <label for="financeCollectBySelect">Collect By</label>
                            <select id="financeCollectBySelect" class="form-select">
                                <option value="">Select</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${showFinanceCollectionCriteria}">
                            <label for="financeGroupBySelect">Group By</label>
                            <select id="financeGroupBySelect" class="form-select">
                                <option value="">Select</option>
                                <option value="class">Class</option>
                                <option value="section">Section</option>
                                <option value="fee_type">Fees Type</option>
                                <option value="payment_mode">Payment Mode</option>
                                <option value="date">Date</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${showFinanceFeesStatementCriteria}">
                            <label for="financeStudentSelect">Student</label>
                            <select id="financeStudentSelect" class="form-select">
                                <option value="">Select</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${showFinanceIncomeHeadCriteria}">
                            <label for="financeIncomeHeadSelect">Search Income Head</label>
                            <select id="financeIncomeHeadSelect" class="form-select">
                                <option value="">Select</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${showFinanceExpenseHeadCriteria}">
                            <label for="financeExpenseHeadSelect">Search Expense Head</label>
                            <select id="financeExpenseHeadSelect" class="form-select">
                                <option value="">Select</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${showOnlineExamCriteria}">
                            <label for="onlineExamSelect">Exam <span class="required-mark">*</span></label>
                            <select id="onlineExamSelect" class="form-select">
                                <option value="">Select</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${showStaffAttendanceCriteria or showStaffDayWiseCriteria}">
                            <label for="staffRoleSelect">Role</label>
                            <select id="staffRoleSelect" class="form-select">
                                <option value="">Select</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${showStaffDayWiseCriteria}">
                            <label for="staffDateInput">Date <span class="required-mark">*</span></label>
                            <input type="date" id="staffDateInput" class="form-input">
                        </div>
                        <div class="form-group" th:if="${showStaffDayWiseCriteria}">
                            <label for="staffSourceSelect">Source</label>
                            <select id="staffSourceSelect" class="form-select">
                                <option value="">Select</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${showStaffAttendanceCriteria}">
                            <label for="staffMonthSelect">Month <span class="required-mark">*</span></label>
                            <select id="staffMonthSelect" class="form-select">
                                <option value="">Select</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${showStaffAttendanceCriteria}">
                            <label for="staffYearSelect">Year <span class="required-mark">*</span></label>
                            <select id="staffYearSelect" class="form-select">
                                <option value="">Select</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${(showClassSection or showOnlineExamCriteria) and !showFinanceCollectionCriteria and !showFinanceFeesStatementCriteria}">
                            <label for="classSelect">
                                Class
                                <span class="required-mark" th:if="${showOnlineExamCriteria}">*</span>
                            </label>
                            <select id="classSelect" class="form-select">
                                <option value="">Select</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${(showClassSection or showOnlineExamCriteria) and !showFinanceCollectionCriteria and !showFinanceFeesStatementCriteria}">
                            <label for="sectionSelect">
                                Section
                                <span class="required-mark" th:if="${showOnlineExamCriteria}">*</span>
                            </label>
                            <select id="sectionSelect" class="form-select">
                                <option value="">Select</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${showOnlineExamDateCriteria}">
                            <label for="onlineExamSearchType">Search Type <span class="required-mark">*</span></label>
                            <select id="onlineExamSearchType" class="form-select">
                                <option value="">Select</option>
                                <option value="today">Today</option>
                                <option value="this_week">This Week</option>
                                <option value="this_month">This Month</option>
                                <option value="this_year" selected>This Year</option>
                                <option value="all">All</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${showOnlineExamDateCriteria}">
                            <label for="onlineExamDateType">Date Type <span class="required-mark">*</span></label>
                            <select id="onlineExamDateType" class="form-select">
                                <option value="">Select</option>
                                <option value="exam_from" selected>Exam From</option>
                                <option value="exam_to">Exam To</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${categorySlug == 'studentinformation' and showClassSection}">
                            <label for="categorySelect">Category</label>
                            <select id="categorySelect" class="form-select">
                                <option value="">Select</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${categorySlug == 'studentinformation' and showClassSection}">
                            <label for="genderSelect">Gender</label>
                            <select id="genderSelect" class="form-select">
                                <option value="">Select</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${categorySlug == 'studentinformation' and showClassSection}">
                            <label for="rteSelect">RTE</label>
                            <select id="rteSelect" class="form-select">
                                <option value="">Select</option>
                                <option value="Yes">Yes</option>
                                <option value="No">No</option>
                            </select>
                        </div>
                        <div class="form-group" th:if="${showDateRange}">
                            <label for="dateFromInput">Date From</label>
                            <input type="date" id="dateFromInput" class="form-input">
                        </div>
                        <div class="form-group" th:if="${showDateRange}">
                            <label for="dateToInput">Date To</label>
                            <input type="date" id="dateToInput" class="form-input">
                        </div>
                        <div class="form-group form-submit" th:if="${needsSearch}">
                            <button type="button" class="btn-search" id="searchBtn">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <path d="m21 21-4.35-4.35"></path>
                                </svg>
                                Search
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="table-section">
                <h2 class="section-title" id="listTitle" th:text="${listTitle}">Report List</h2>
                <div class="table-controls">
                    <div class="table-search">
                        <svg class="table-search-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="tableSearchInput" class="table-search-input" placeholder="Search">
                    </div>
                    <div class="table-actions">
                        <select class="entries-select" id="entriesSelect">
                            <option value="10">10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="50" selected>50</option>
                            <option value="100">100</option>
                        </select>
                        <button type="button" class="icon-action-btn" id="excelBtn" title="Excel">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                        </button>
                        <button type="button" class="icon-action-btn" id="csvBtn" title="CSV">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                        </button>
                        <button type="button" class="icon-action-btn" id="pdfBtn" title="PDF">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                        </button>
                        <button type="button" class="icon-action-btn" id="printBtn" title="Print">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                                <rect x="6" y="14" width="12" height="8"></rect>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="data-table" id="reportTable">
                        <thead id="reportTableHead"></thead>
                        <tbody id="reportTableBody">
                            <tr class="empty-row">
                                <td colspan="8">
                                    <div class="empty-state">
                                        <p class="empty-message">No data available in table</p>
                                        <p class="empty-hint" id="emptyHint">Select criteria and click Search.</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="table-footer">
                    <div class="showing-info" id="showingInfo">Showing 0 to 0 of 0 entries</div>
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/dashboard.js}"></script>
    <script th:src="@{/js/report-module.js}"></script>
</body>
</html>
