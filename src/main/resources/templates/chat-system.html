<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat System - Smart School</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/chat-system.css}">
    <link rel="stylesheet" th:href="@{/css/app-theme.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <nav th:replace="~{fragments/top-navbar :: top-navbar}"></nav>

    <div class="main-container">
        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <main class="main-content chat-page">
            <section class="chat-card">
                <div class="chat-topbar">
                    <div class="chat-topbar-left">
                        <h2 class="chat-title">Chat System</h2>
                        <button type="button" class="chat-new-btn" id="newChatBtn" title="New Chat">
                            <span class="chat-new-icon">+</span>
                        </button>
                    </div>
                    <div class="chat-topbar-center" id="chatHeaderCenter">
                        <div class="chat-header-avatar no-image">NO IMAGE</div>
                        <span class="chat-header-text">Select Any User To Start Your Chat</span>
                    </div>
                </div>

                <div class="chat-layout">
                    <aside class="chat-sidebar" id="chatSidebar">
                        <div class="chat-contact-list" id="chatContactList"></div>
                    </aside>

                    <section class="chat-main">
                        <div class="chat-messages" id="chatMessages">
                            <div class="chat-empty-state">
                                <div class="chat-empty-avatar no-image">NO IMAGE</div>
                                <p>Select a user from the list to view the conversation.</p>
                            </div>
                        </div>
                        <form class="chat-compose" id="chatComposeForm">
                            <input type="text" id="chatMessageInput" class="chat-message-input" placeholder="Write Your Message..." disabled>
                            <button type="submit" class="chat-send-btn" id="chatSendBtn" disabled title="Send">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                </svg>
                            </button>
                        </form>
                    </section>
                </div>
            </section>
        </main>
    </div>

    <div class="chat-modal-backdrop" id="addContactModal" hidden>
        <div class="chat-modal" role="dialog" aria-modal="true" aria-labelledby="addContactTitle">
            <div class="chat-modal-header">
                <h3 id="addContactTitle">Add Contact <span class="required">*</span></h3>
                <button type="button" class="chat-modal-close" id="closeAddContactModal" aria-label="Close">&times;</button>
            </div>
            <div class="chat-modal-body">
                <div class="chat-modal-search-wrap">
                    <input type="text" id="addContactSearch" class="chat-modal-search" placeholder="" autocomplete="off">
                    <span class="chat-modal-spinner" id="addContactSpinner" hidden aria-hidden="true"></span>
                </div>
                <div class="chat-modal-results" id="addContactResults"></div>
            </div>
            <div class="chat-modal-footer">
                <button type="button" class="chat-modal-add-btn" id="addContactBtn" disabled>
                    <span class="chat-modal-add-icon">+</span> Add
                </button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/dashboard.js}"></script>
    <script th:src="@{/js/chat-system.js}"></script>
</body>
</html>
