<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:fragment="layout(title, content)">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">User Panel</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css(v=20260830-7)}">
    <link rel="stylesheet" th:href="@{/css/user-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/app-theme.css(v=20260830-7)}">
    <link rel="stylesheet" th:href="@{/css/user-profile.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="user-panel-body" th:attr="data-active-submenu=${activeSubmenu}">
    <div th:replace="~{fragments/user-top-navbar :: user-top-navbar}"></div>

    <div class="main-container">
        <div th:replace="~{fragments/user-sidebar :: user-sidebar}"></div>

        <main class="main-content user-dashboard-content">
            <th:block th:replace="${content}" />
        </main>
    </div>

    <script th:src="@{/js/user-dashboard.js(v=20260830-7)}"></script>
</body>
</html>
