<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
    <nav class="top-navbar admin-compact-header" th:fragment="top-navbar">
        <div class="nav-left">
            <div class="logo-container">
                <a th:href="${staffDashboardUrl != null ? staffDashboardUrl : '/admin/admin/dashboard'}" class="brand-badge" style="text-decoration: none;" th:text="${schoolName != null ? schoolName : 'Smart School'}">Smart School</a>
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="35" height="35">
                        <defs>
                            <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#f6c544;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#f39c12;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <rect x="8" y="10" width="34" height="32" fill="url(#bookGradient)" rx="2"/>
                        <rect x="10" y="12" width="30" height="28" fill="#f39c12" rx="1"/>
                        <path d="M 25 12 L 25 40" stroke="#f6c544" stroke-width="2"/>
                        <polygon points="15,20 35,20 25,15" fill="#2d3748"/>
                        <rect x="24" y="20" width="2" height="8" fill="#2d3748"/>
                        <circle cx="26" cy="29" r="1.5" fill="#e74c3c"/>
                    </svg>
                </div>
                <button class="hamburger-btn" type="button" aria-label="Toggle sidebar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <span class="school-name" th:text="${schoolName != null ? schoolName : 'Smart School'}">Smart School</span>
            </div>
            <div class="session-info">
                <span class="session-label">Current Session:</span>
                <span class="session-value" th:text="${currentSession != null ? currentSession : '2026-27'}">2026-27</span>
            </div>
        </div>

        <div class="nav-right">
            <div class="nav-icons">
                <div class="language-picker-wrap">
                    <button class="icon-btn icon-btn-flag language-picker-trigger" type="button" title="Language" aria-haspopup="true" aria-expanded="false">
                        <img th:src="'https://flagcdn.com/w20/' + ${activeLanguage != null ? activeLanguage.headerFlagCode : 'us'} + '.png'"
                             th:alt="${activeLanguage != null ? activeLanguage.name : 'Language'}"
                             width="20" height="14">
                    </button>
                    <div class="language-picker-dropdown">
                        <div class="language-picker-list" role="menu">
                            <button type="button"
                                    class="language-picker-item"
                                    th:each="lang : ${headerLanguages}"
                                    th:classappend="${lang.isDefault} ? ' is-active' : ''"
                                    th:attr="data-language-id=${lang.id},data-language-code=${lang.shortCode},data-country-code=${lang.countryCode},data-language-name=${lang.name},data-is-rtl=${lang.isRtl}"
                                    role="menuitem">
                                <img th:src="'https://flagcdn.com/w20/' + ${lang.listFlagCode} + '.png'" alt="" width="20" height="14">
                                <span th:text="${lang.name}">English</span>
                            </button>
                        </div>
                    </div>
                </div>
                <button class="icon-btn" type="button" title="Calendar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                </button>
                <button class="icon-btn" type="button" title="Tasks">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 11 12 14 22 4"></polyline>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                </button>
                <button class="icon-btn" type="button" title="Notifications">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span class="notification-badge" th:if="${noticeCount != null and noticeCount > 0}"
                          th:text="${noticeCount}">0</span>
                </button>
                <button class="icon-btn icon-btn-whatsapp" type="button" title="WhatsApp">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="#25D366">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
                        <path d="M12 0C5.373 0 0 5.373 0 12c0 2.625.846 5.059 2.284 7.034L.789 23.492a.75.75 0 0 0 .918.918l4.458-1.495A11.945 11.945 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.75a9.714 9.714 0 0 1-4.956-1.354l-.355-.211-2.642.886.886-2.578-.231-.375A9.714 9.714 0 0 1 2.25 12C2.25 6.615 6.615 2.25 12 2.25S21.75 6.615 21.75 12 17.385 21.75 12 21.75z"/>
                    </svg>
                </button>
                <div th:replace="~{fragments/profile-dropdown :: staff-profile-dropdown}"></div>
            </div>
        </div>
    </nav>
</body>
</html>
