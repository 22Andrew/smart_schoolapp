<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<nav class="top-navbar user-top-navbar" th:fragment="user-top-navbar">
    <div class="nav-left">
        <div class="logo-container">
            <a th:href="@{/user/user/dashboard}" class="brand-badge" style="text-decoration: none;">Smart School</a>
            <div class="logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="35" height="35">
                    <defs>
                        <linearGradient id="userBookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#f6c544;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#f39c12;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect x="8" y="10" width="34" height="32" fill="url(#userBookGradient)" rx="2"/>
                    <rect x="10" y="12" width="30" height="28" fill="#f39c12" rx="1"/>
                    <path d="M 25 12 L 25 40" stroke="#f6c544" stroke-width="2"/>
                    <polygon points="15,20 35,20 25,15" fill="#2d3748"/>
                    <rect x="24" y="20" width="2" height="8" fill="#2d3748"/>
                    <circle cx="26" cy="29" r="1.5" fill="#e74c3c"/>
                </svg>
            </div>
            <button class="hamburger-btn" type="button" aria-label="Toggle sidebar">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <span class="school-name" th:text="${schoolName}">Mount Carmel School</span>
        </div>
    </div>

    <div class="nav-right">
        <div class="nav-icons user-nav-icons">
            <button class="icon-btn user-flag-btn" type="button" title="Language">
                <img src="https://flagcdn.com/w20/us.png" alt="US" width="20" height="14">
            </button>
            <span class="user-currency-label">USD</span>
            <button class="icon-btn" type="button" title="Currency">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="1" x2="12" y2="23"></line>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
            </button>
            <button class="icon-btn" type="button" title="Calendar">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
            </button>
            <button class="icon-btn user-icon-badge-btn" type="button" title="Tasks">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 11 12 14 22 4"></polyline>
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                </svg>
                <span class="user-nav-badge user-nav-badge-warning">1</span>
            </button>
            <button class="icon-btn user-icon-badge-btn" type="button" title="Messages">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <span class="user-nav-badge user-nav-badge-danger">0</span>
            </button>
            <button class="icon-btn user-whatsapp-btn" type="button" title="WhatsApp">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                </svg>
            </button>
            <div th:replace="~{fragments/profile-dropdown :: user-profile-dropdown}"></div>
        </div>
    </div>
</nav>
</body>
</html>
