<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Inventory Report - Smart School</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/inventory-report.css}">
    <link rel="stylesheet" th:href="@{/css/app-theme.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <nav th:replace="~{fragments/top-navbar :: top-navbar}"></nav>

    <div class="main-container">
        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <main class="main-content inv-report-page" id="invReportRoot"
              th:attr="data-report-key=${reportKey},data-api-url=${apiUrl},data-active-nav=${activeNav},data-list-title=${listTitle}">
            <div class="inv-report-panel">
                <div class="inv-report-header">
                    <h2 class="inv-report-title">Inventory Report</h2>
                </div>

                <div class="inv-report-nav-grid">
                    <a href="/admin/report/inventorystock"
                       class="inv-report-nav-item"
                       th:classappend="${activeNav == 'stock'} ? ' active'">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                        Stock Report
                    </a>
                    <a href="/report/additem"
                       class="inv-report-nav-item"
                       th:classappend="${activeNav == 'additem'} ? ' active'">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                        Add Item Report
                    </a>
                    <a href="/report/issueinventory"
                       class="inv-report-nav-item"
                       th:classappend="${activeNav == 'issue'} ? ' active'">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                        Issue Item Report
                    </a>
                </div>

                <div class="inv-criteria-panel">
                    <h3 class="criteria-heading">Select Criteria</h3>
                    <form class="inv-criteria-form" id="invCriteriaForm">
                        <div class="inv-criteria-grid">
                            <div class="form-group">
                                <label for="searchTypeSelect">Search Type</label>
                                <select id="searchTypeSelect" class="form-select">
                                    <option value="">Select</option>
                                    <option value="today">Today</option>
                                    <option value="this_week">This Week</option>
                                    <option value="this_month">This Month</option>
                                    <option value="this_year">This Year</option>
                                    <option value="last_month">Last Month</option>
                                    <option value="all">All</option>
                                </select>
                            </div>
                        </div>
                        <div class="inv-criteria-actions">
                            <button type="submit" class="btn-search" id="searchBtn">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <path d="m21 21-4.35-4.35"></path>
                                </svg>
                                Search
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="inv-results-panel" id="resultsPanel">
                <h3 class="results-heading" id="resultsHeading" th:text="${listTitle}">Stock Report</h3>
                <div class="table-controls">
                    <div class="table-search">
                        <input type="text" id="tableSearchInput" class="table-search-input" placeholder="Search">
                    </div>
                    <div class="table-actions">
                        <select class="entries-select" id="entriesSelect">
                            <option value="10">10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                        <button type="button" class="icon-action-btn" id="copyBtn" title="Copy">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                        <button type="button" class="icon-action-btn" id="excelBtn" title="Excel">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                        </button>
                        <button type="button" class="icon-action-btn" id="csvBtn" title="CSV">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                        </button>
                        <button type="button" class="icon-action-btn" id="pdfBtn" title="PDF">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                        </button>
                        <button type="button" class="icon-action-btn" id="printBtn" title="Print">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                                <rect x="6" y="14" width="12" height="8"></rect>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="inv-report-table" id="reportTable">
                        <thead id="reportTableHead"></thead>
                        <tbody id="reportTableBody">
                            <tr class="empty-row">
                                <td colspan="8">
                                    <div class="empty-state">
                                        <p class="empty-message">No data available in table</p>
                                        <div class="empty-illustration" aria-hidden="true">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                                            </svg>
                                        </div>
                                        <p class="empty-hint">← Add new record or search with different criteria.</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="table-footer">
                    <div class="showing-info" id="showingInfo">Showing 0 to 0 of 0 entries</div>
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/dashboard.js}"></script>
    <script th:src="@{/js/inventory-report.js}"></script>
</body>
</html>
