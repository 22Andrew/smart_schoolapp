# Production profile for Railway and other cloud hosts.
# All secrets must come from environment variables — no fallbacks.

spring.jpa.show-sql=false
spring.web.resources.static-locations=classpath:/static/
app.database.bootstrap-from-backup=${APP_DATABASE_BOOTSTRAP:auto}

# Database (required on Railway)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Demo login passwords (required — set in Railway Variables)
app.demo.student-password=${APP_DEMO_STUDENT_PASSWORD}
app.demo.parent-password=${APP_DEMO_PARENT_PASSWORD}
app.demo.staff.superadmin-password=${APP_DEMO_STAFF_SUPERADMIN_PASSWORD}
app.demo.staff.admin-password=${APP_DEMO_STAFF_ADMIN_PASSWORD}
app.demo.staff.teacher-password=${APP_DEMO_STAFF_TEACHER_PASSWORD}
app.demo.staff.accountant-password=${APP_DEMO_STAFF_ACCOUNTANT_PASSWORD}
app.demo.staff.receptionist-password=${APP_DEMO_STAFF_RECEPTIONIST_PASSWORD}
app.demo.staff.librarian-password=${APP_DEMO_STAFF_LIBRARIAN_PASSWORD}
