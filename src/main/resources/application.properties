# App Name
spring.application.name=smart_schoolapp
app.version=0.0.1-SNAPSHOT

# Optional local overrides (never commit application-local.properties)
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

# Server (Railway sets PORT)
server.port=${PORT:8080}

# MySQL Database Connection — set via environment variables on Railway
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_schoolapp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.type.preferred_java_type_jdbc_type_code=12e

# Demo login passwords — override with environment variables (see .env.example)
app.demo.student-password=${APP_DEMO_STUDENT_PASSWORD:110001}
app.demo.parent-password=${APP_DEMO_PARENT_PASSWORD:110001}
app.demo.staff.superadmin-password=${APP_DEMO_STAFF_SUPERADMIN_PASSWORD:Superadmin1}
app.demo.staff.admin-password=${APP_DEMO_STAFF_ADMIN_PASSWORD:Admin123}
app.demo.staff.teacher-password=${APP_DEMO_STAFF_TEACHER_PASSWORD:Teacher123}
app.demo.staff.accountant-password=${APP_DEMO_STAFF_ACCOUNTANT_PASSWORD:Accountant123}
app.demo.staff.receptionist-password=${APP_DEMO_STAFF_RECEPTIONIST_PASSWORD:Receptionist123}
app.demo.staff.librarian-password=${APP_DEMO_STAFF_LIBRARIAN_PASSWORD:Librarian123}

# Student photo uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-part-count=200
server.tomcat.max-parameter-count=10000
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# Database bootstrap: restores bundled SQL backup (211 tables, Smart School operational data).
# Modes: off | auto (default) | force
app.database.bootstrap-from-backup=${APP_DATABASE_BOOTSTRAP:auto}
app.database.bootstrap-backup-file=db_ver_7.1.0_2026-08-21_12-25-41.sql
app.database.bootstrap-if-incomplete=true
app.database.incomplete-table-threshold-percent=12

# Static assets (CSS/JS/images) - fallback to source folder during local IDE runs
spring.web.resources.static-locations=classpath:/static/,file:./src/main/resources/static/
