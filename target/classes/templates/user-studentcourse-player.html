<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{fragments/user-layout :: layout(~{::title}, ~{::#user-studentcourse-player-page})}">
<head>
    <title th:text="|${schoolName} - Course|">Mount Carmel School - Course</title>
</head>
<body>
<div id="user-studentcourse-player-page" class="uscp-page">
    <link rel="stylesheet" th:href="@{/css/user-studentcourse-player.css}">
    <input type="hidden" id="uscpCourseId" th:value="${courseId}">

    <div class="uscp-topbar">
        <a th:href="@{/user/studentcourse}" class="uscp-back-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back To Course List
        </a>
        <h1 class="uscp-course-title" id="uscpCourseTitle">Loading...</h1>
        <button type="button" class="uscp-performance-btn" id="uscpPerformanceBtn">Course Performance</button>
    </div>

    <div class="uscp-layout">
        <aside class="uscp-detail-pane">
            <div class="uscp-detail-image" id="uscpCourseImage"></div>
            <div class="uscp-detail-list">
                <div class="uscp-detail-row">
                    <div class="uscp-detail-label">Title</div>
                    <div class="uscp-detail-value" id="uscpDetailTitle">-</div>
                </div>
                <div class="uscp-detail-row">
                    <div class="uscp-detail-label">Description</div>
                    <div class="uscp-detail-value" id="uscpDetailDescription">-</div>
                </div>
                <div class="uscp-detail-row">
                    <div class="uscp-detail-label">Class</div>
                    <div class="uscp-detail-value" id="uscpDetailClass">-</div>
                </div>
                <div class="uscp-detail-row">
                    <div class="uscp-detail-label">Section</div>
                    <div class="uscp-detail-value" id="uscpDetailSection">-</div>
                </div>
                <div class="uscp-detail-row">
                    <div class="uscp-detail-label">Assign Teacher</div>
                    <div class="uscp-detail-value" id="uscpDetailTeacher">-</div>
                </div>
                <div class="uscp-detail-row">
                    <div class="uscp-detail-label">Progress</div>
                    <div class="uscp-detail-value">
                        <div class="uscp-progress-track">
                            <div class="uscp-progress-fill" id="uscpDetailProgressFill"></div>
                        </div>
                        <span id="uscpDetailProgressText">0%</span>
                    </div>
                </div>
            </div>
            <div class="uscp-outcomes" id="uscpOutcomesWrap" hidden>
                <h3>What will I learn?</h3>
                <ul id="uscpOutcomesList"></ul>
            </div>
        </aside>

        <section class="uscp-curriculum-pane">
            <div class="uscp-curriculum-head">
                <h2>Curriculum for this course</h2>
                <div class="uscp-curriculum-meta" id="uscpCurriculumMeta"></div>
            </div>
            <div class="uscp-sections" id="uscpSections">
                <div class="uscp-loading">Loading curriculum...</div>
            </div>
        </section>
    </div>

    <div class="uscp-lesson-modal" id="uscpLessonModal" aria-hidden="true">
        <div class="uscp-lesson-overlay" id="uscpLessonOverlay"></div>
        <div class="uscp-lesson-dialog" role="dialog" aria-modal="true">
            <div class="uscp-lesson-header">
                <h3 id="uscpLessonTitle">Lesson</h3>
                <button type="button" class="uscp-lesson-close" id="uscpLessonClose" aria-label="Close">&times;</button>
            </div>
            <div class="uscp-lesson-body">
                <div class="uscp-lesson-video-wrap" id="uscpLessonVideoWrap"></div>
                <div class="uscp-lesson-summary" id="uscpLessonSummary"></div>
            </div>
        </div>
    </div>

    <div class="uscp-performance-modal" id="uscpPerformanceModal" aria-hidden="true">
        <div class="uscp-lesson-overlay" id="uscpPerformanceOverlay"></div>
        <div class="uscp-performance-dialog" role="dialog" aria-modal="true">
            <div class="uscp-lesson-header">
                <h3>Course Performance</h3>
                <button type="button" class="uscp-lesson-close" id="uscpPerformanceClose" aria-label="Close">&times;</button>
            </div>
            <div class="uscp-performance-body" id="uscpPerformanceBody"></div>
        </div>
    </div>

    <script th:src="@{/js/user-studentcourse-player.js}"></script>
</div>
</body>
</html>
