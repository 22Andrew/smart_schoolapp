<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{fragments/user-layout :: layout(~{::title}, ~{::#user-notification-page})}">
<head>
    <title th:text="|${schoolName} - Notice Board|">Mount Carmel School - Notice Board</title>
</head>
<body>
<div id="user-notification-page" class="ugm-page unb-page">
    <link rel="stylesheet" th:href="@{/css/user-gmeet.css}">
    <link rel="stylesheet" th:href="@{/css/user-notification.css}">

    <div class="unb-card">
        <div class="unb-header">
            <h1 class="unb-title">Notice Board</h1>
        </div>

        <div class="unb-list-wrap">
            <div class="unb-list" id="unbList">
                <p class="unb-empty">Loading notices...</p>
            </div>

            <aside class="unb-drawer" id="unbDrawer" aria-hidden="true">
                <div class="unb-drawer-header">
                    <button type="button" class="unb-drawer-back" id="unbDrawerBack" aria-label="Back">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <h2 class="unb-drawer-title" id="unbDrawerTitle">Notice Details</h2>
                    <button type="button" class="unb-drawer-close" id="unbDrawerClose" aria-label="Close">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="unb-drawer-body">
                    <h3 class="unb-detail-heading" id="unbDetailHeading"></h3>
                    <div class="unb-detail-meta">
                        <div class="unb-meta-item">
                            <span>Publish Date:</span>
                            <strong id="unbDetailPublishDate"></strong>
                        </div>
                        <div class="unb-meta-item">
                            <span>Notice Date:</span>
                            <strong id="unbDetailNoticeDate"></strong>
                        </div>
                    </div>
                    <div class="unb-detail-section">
                        <h4 class="unb-section-title">Message To</h4>
                        <div class="unb-recipients" id="unbDetailRecipients"></div>
                    </div>
                    <div class="unb-detail-section">
                        <h4 class="unb-section-title">Message</h4>
                        <div class="unb-detail-message" id="unbDetailMessage"></div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script th:src="@{/js/user-notification.js}"></script>
</div>
</body>
</html>
