<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{fragments/user-layout :: layout(~{::title}, ~{::#user-teacher-page})}">
<head>
    <title th:text="|${schoolName} - Teachers Reviews|">Mount Carmel School - Teachers Reviews</title>
</head>
<body>
<div id="user-teacher-page" class="ugm-page utr-page">
    <link rel="stylesheet" th:href="@{/css/user-gmeet.css}">
    <link rel="stylesheet" th:href="@{/css/user-teacher.css}">

    <div class="ugm-card">
        <div class="ugm-header">
            <h1 class="ugm-title">Teachers Reviews</h1>
        </div>

        <div class="ugm-toolbar">
            <div class="ugm-search">
                <input type="text" id="utrSearchInput" class="ugm-search-input" placeholder="Search" autocomplete="off">
            </div>
            <div class="ugm-toolbar-right">
                <select class="ugm-entries-select" id="utrEntriesSelect" aria-label="Rows per page">
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50" selected>50</option>
                    <option value="100">100</option>
                </select>
                <div class="ugm-actions table-actions">
                    <button type="button" class="icon-action-btn" id="utrCopyBtn" title="Copy">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                    <button type="button" class="icon-action-btn" id="utrExcelBtn" title="Excel">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                    </button>
                    <button type="button" class="icon-action-btn" id="utrCsvBtn" title="CSV">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                    </button>
                    <button type="button" class="icon-action-btn" id="utrPdfBtn" title="PDF">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M10 12h4"></path><path d="M10 16h4"></path></svg>
                    </button>
                    <button type="button" class="icon-action-btn" id="utrPrintBtn" title="Print">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                    </button>
                    <div class="column-visibility-wrap ugm-colvis-wrap">
                        <button type="button" class="icon-action-btn" id="utrColumnsBtn" title="Column Visibility">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                        </button>
                        <div class="column-visibility-dropdown" id="utrColumnsDropdown">
                            <div class="dropdown-header"><span>Toggle Columns</span></div>
                            <div class="dropdown-content">
                                <label class="column-toggle-item"><input type="checkbox" class="utr-column-toggle" data-column="0" checked><span>Teacher Name</span></label>
                                <label class="column-toggle-item"><input type="checkbox" class="utr-column-toggle" data-column="1" checked><span>Subject</span></label>
                                <label class="column-toggle-item"><input type="checkbox" class="utr-column-toggle" data-column="2" checked><span>Time</span></label>
                                <label class="column-toggle-item"><input type="checkbox" class="utr-column-toggle" data-column="3" checked><span>Room No.</span></label>
                                <label class="column-toggle-item"><input type="checkbox" class="utr-column-toggle" data-column="4" checked><span>Email</span></label>
                                <label class="column-toggle-item"><input type="checkbox" class="utr-column-toggle" data-column="5" checked><span>Phone</span></label>
                                <label class="column-toggle-item"><input type="checkbox" class="utr-column-toggle" data-column="6" checked><span>My Rating</span></label>
                                <label class="column-toggle-item"><input type="checkbox" class="utr-column-toggle" data-column="7" checked><span>Comment</span></label>
                                <label class="column-toggle-item"><input type="checkbox" class="utr-column-toggle" data-column="8" checked><span>Rate</span></label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="ugm-table-wrap">
            <table class="ugm-table data-table utr-table" id="utrTable">
                <thead>
                    <tr>
                        <th data-sort="teacherDisplay">Teacher Name <span class="sort-icon">↕</span></th>
                        <th>Subject</th>
                        <th>Time</th>
                        <th>Room No.</th>
                        <th data-sort="email">Email <span class="sort-icon">↕</span></th>
                        <th data-sort="phone">Phone <span class="sort-icon">↕</span></th>
                        <th data-sort="myRating">My Rating <span class="sort-icon">↕</span></th>
                        <th data-sort="comment">Comment <span class="sort-icon">↕</span></th>
                        <th class="ugm-col-center">Rate</th>
                    </tr>
                </thead>
                <tbody id="utrTableBody">
                    <tr class="ugm-empty-row">
                        <td colspan="9">Loading teachers...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="ugm-footer">
            <div class="ugm-showing" id="utrShowingInfo">Showing 0 to 0 of 0 entries</div>
            <div class="ugm-pagination" id="utrPagination"></div>
        </div>
    </div>

    <div class="utr-modal" id="utrRateModal" hidden>
        <div class="utr-modal-overlay" id="utrRateOverlay"></div>
        <div class="utr-rate-card" role="dialog" aria-modal="true" aria-labelledby="utrRateTitle">
            <div class="utr-rate-header">
                <h2 id="utrRateTitle">Rate</h2>
                <button type="button" class="utr-rate-close" id="utrRateClose" aria-label="Close">&times;</button>
            </div>
            <div class="utr-rate-body">
                <div class="utr-rate-field">
                    <label for="utrRatingStars">Rating <span class="utr-required">*</span></label>
                    <div class="utr-rating-input" id="utrRatingStars" role="radiogroup" aria-label="Rating">
                        <button type="button" class="utr-star-btn" data-value="1" aria-label="1 star">★</button>
                        <button type="button" class="utr-star-btn" data-value="2" aria-label="2 stars">★</button>
                        <button type="button" class="utr-star-btn" data-value="3" aria-label="3 stars">★</button>
                        <button type="button" class="utr-star-btn" data-value="4" aria-label="4 stars">★</button>
                        <button type="button" class="utr-star-btn" data-value="5" aria-label="5 stars">★</button>
                    </div>
                </div>
                <div class="utr-rate-field utr-rate-field-block">
                    <label for="utrCommentInput">Comment <span class="utr-required">*</span></label>
                    <textarea id="utrCommentInput" class="utr-comment-input" rows="3"></textarea>
                </div>
            </div>
            <div class="utr-rate-footer">
                <button type="button" class="utr-save-btn" id="utrSaveBtn">Save</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script th:src="@{/js/user-teacher.js}"></script>
</div>
</body>
</html>
