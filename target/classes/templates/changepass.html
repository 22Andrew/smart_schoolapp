<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Smart School</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/changepass.css}">
    <link rel="stylesheet" th:href="@{/css/app-theme.css(v=20260830-7)}">
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav th:replace="~{fragments/top-navbar :: top-navbar}"></nav>

    <div class="main-container">
        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <main class="main-content changepass-page">
            <div th:if="${successMessage}" class="changepass-alert changepass-alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="changepass-alert changepass-alert-error" th:text="${errorMessage}"></div>

            <section class="changepass-card">
                <form th:action="@{/admin/admin/changepass}" method="post" id="changePasswordForm">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="changepass-form-body">
                        <div class="changepass-form-row">
                            <label for="currentPassword">Current Password</label>
                            <input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password" required>
                        </div>
                        <div class="changepass-form-row">
                            <label for="newPassword">New Password</label>
                            <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" required>
                        </div>
                        <div class="changepass-form-row">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
                        </div>
                    </div>

                    <div class="changepass-form-footer">
                        <button type="submit" class="changepass-submit-btn">Change Password</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <div th:replace="~{fragments/quick-links-modal :: modal}"></div>
    <script th:src="@{/js/dashboard.js(v=20260830-7)}"></script>
</body>
</html>
