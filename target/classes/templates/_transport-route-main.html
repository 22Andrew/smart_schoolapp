        <!-- Main Content -->
        <main class="main-content transport-page">
            <div class="split-container">
                <div class="add-panel">
                    <h2 class="panel-title">Create Route</h2>
                    <form id="routeForm">
                        <input type="hidden" id="routeId" value="">
                        <div class="form-group">
                            <label for="routeTitle">Route Title <span class="required">*</span></label>
                            <input type="text" id="routeTitle" class="form-control" required>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-save" id="saveRouteBtn">Save</button>
                        </div>
                    </form>
                </div>
                <div class="list-panel">
                    <h2 class="panel-title">Route List</h2>
                    <div class="table-controls">
                        <input type="text" class="table-search-input" id="searchInput" placeholder="Search">
                        <div class="table-actions">
                            <select class="entries-select" id="entriesSelect"><option value="50" selected>50</option><option value="100">100</option><option value="250">250</option><option value="500">500</option></select>
                            <button type="button" class="icon-action-btn" id="copyBtn" title="Copy">C</button>
                            <button type="button" class="icon-action-btn" id="excelBtn" title="Excel">X</button>
                            <button type="button" class="icon-action-btn" id="csvBtn" title="CSV">V</button>
                            <button type="button" class="icon-action-btn" id="pdfBtn" title="PDF">P</button>
                            <button type="button" class="icon-action-btn" id="printBtn" title="Print">R</button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead><tr><th>Route Title</th><th>Action</th></tr></thead>
                            <tbody id="routeTableBody"></tbody>
                        </table>
                    </div>
                    <div class="table-footer">
                        <div class="showing-info" id="showingInfo">Showing 0 to 0 of 0 entries</div>
                        <div class="pagination" id="pagination"></div>
                    </div>
                </div>
            </div>
        </main>
