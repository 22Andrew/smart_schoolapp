<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{fragments/user-layout :: layout(~{::title}, ~{::#user-studentcourse-page})}">
<head>
    <title th:text="|${schoolName} - Course List|">Mount Carmel School - Course List</title>
</head>
<body>
<div id="user-studentcourse-page" class="usc-page">
    <link rel="stylesheet" th:href="@{/css/user-studentcourse.css}">

    <div class="usc-header">
        <h1 class="usc-title">Course List</h1>
        <div class="usc-view-toggles">
            <button type="button" class="usc-view-btn active" id="uscGridViewBtn" title="Grid View" aria-label="Grid View">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
            </button>
            <button type="button" class="usc-view-btn" id="uscListViewBtn" title="List View" aria-label="List View">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>

    <div class="usc-grid" id="uscCourseGrid">
        <div class="usc-loading">Loading courses...</div>
    </div>

    <script th:src="@{/js/user-studentcourse.js}"></script>
</div>
</body>
</html>
