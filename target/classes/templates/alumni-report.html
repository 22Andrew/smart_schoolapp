<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Alumni Report - Smart School</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/alumni-report.css}">
    <link rel="stylesheet" th:href="@{/css/app-theme.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <nav th:replace="~{fragments/top-navbar :: top-navbar}"></nav>

    <div class="main-container">
        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <main class="main-content ar-report-page" id="arReportRoot"
              th:attr="data-report-key=${reportKey},data-api-url=${apiUrl},data-list-title=${listTitle}">
            <div class="ar-criteria-panel">
                <h3 class="criteria-heading">Select Criteria</h3>
                <form class="ar-criteria-form" id="arCriteriaForm">
                    <div class="ar-criteria-grid">
                        <div class="form-group">
                            <label for="sessionSelect">Pass Out Session <span class="required">*</span></label>
                            <select id="sessionSelect" class="form-select" required>
                                <option value="">Select</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="classSelect">Class <span class="required">*</span></label>
                            <select id="classSelect" class="form-select" required>
                                <option value="">Select</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="sectionSelect">Section</label>
                            <select id="sectionSelect" class="form-select" disabled>
                                <option value="">Select</option>
                            </select>
                        </div>
                    </div>
                    <div class="ar-criteria-actions">
                        <button type="submit" class="btn-search" id="searchBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                            Search
                        </button>
                    </div>
                </form>
            </div>

            <div class="ar-results-panel" id="resultsPanel">
                <h3 class="results-heading" id="resultsHeading" th:text="${listTitle}">Alumni Report</h3>
                <div class="table-controls">
                    <div class="table-search">
                        <input type="text" id="tableSearchInput" class="table-search-input" placeholder="Search">
                    </div>
                    <div class="table-actions">
                        <select class="entries-select" id="entriesSelect">
                            <option value="10">10</option>
                            <option value="25">25</option>
                            <option value="50" selected>50</option>
                            <option value="100">100</option>
                        </select>
                        <button type="button" class="icon-action-btn" id="copyBtn" title="Copy">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                        <button type="button" class="icon-action-btn" id="excelBtn" title="Excel">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                        </button>
                        <button type="button" class="icon-action-btn" id="pdfBtn" title="PDF">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                        </button>
                        <button type="button" class="icon-action-btn" id="printBtn" title="Print">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                                <rect x="6" y="14" width="12" height="8"></rect>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="ar-report-table" id="reportTable">
                        <thead id="reportTableHead"></thead>
                        <tbody id="reportTableBody">
                            <tr class="empty-row">
                                <td colspan="9">
                                    <div class="empty-state">
                                        <p class="empty-message">No data available in table</p>
                                        <div class="empty-illustration" aria-hidden="true">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                                            </svg>
                                        </div>
                                        <p class="empty-hint">← Add new record or search with different criteria.</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="table-footer">
                    <div class="showing-info" id="showingInfo">Showing 0 to 0 of 0 entries</div>
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/dashboard.js}"></script>
    <script th:src="@{/js/alumni-report.js}"></script>
</body>
</html>
