<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
    <nav class="top-navbar" th:fragment="top-navbar">
        <div class="nav-left">
            <div class="logo-container">
                <a href="/dashboard" class="brand-badge" style="text-decoration: none;">Smart School</a>
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="35" height="35">
                        <defs>
                            <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#f6c544;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#f39c12;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <rect x="8" y="10" width="34" height="32" fill="url(#bookGradient)" rx="2"/>
                        <rect x="10" y="12" width="30" height="28" fill="#f39c12" rx="1"/>
                        <path d="M 25 12 L 25 40" stroke="#f6c544" stroke-width="2"/>
                        <polygon points="15,20 35,20 25,15" fill="#2d3748"/>
                        <rect x="24" y="20" width="2" height="8" fill="#2d3748"/>
                        <circle cx="26" cy="29" r="1.5" fill="#e74c3c"/>
                    </svg>
                </div>
                <button class="hamburger-btn" type="button" aria-label="Toggle sidebar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <span class="school-name">Smart School</span>
            </div>
            <div class="session-info">
                <span class="session-label">Current Session:</span>
                <span class="session-value">2026-27</span>
            </div>
        </div>

        <div class="nav-right">
            <div class="search-container">
                <input type="text" placeholder="Search By Student Name..." class="search-input">
                <button class="search-btn" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
            </div>

            <div class="nav-icons">
                <button class="icon-btn" id="topQuickLinksBtn" type="button" title="Quick Links" aria-label="Quick Links">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="5" height="5" rx="1"></rect>
                        <rect x="10" y="3" width="5" height="5" rx="1"></rect>
                        <rect x="17" y="3" width="5" height="5" rx="1"></rect>
                        <rect x="3" y="10" width="5" height="5" rx="1"></rect>
                        <rect x="10" y="10" width="5" height="5" rx="1"></rect>
                        <rect x="17" y="10" width="5" height="5" rx="1"></rect>
                        <rect x="3" y="17" width="5" height="5" rx="1"></rect>
                        <rect x="10" y="17" width="5" height="5" rx="1"></rect>
                        <rect x="17" y="17" width="5" height="5" rx="1"></rect>
                    </svg>
                </button>
                <button class="icon-btn" type="button" title="Currency">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </button>
                <a href="/admin/chat" class="icon-btn" title="Messages">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                </a>
                <a href="/admin/calendar/events" class="icon-btn" title="Calendar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                </a>
                <button class="icon-btn" type="button" title="Tasks">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 11 12 14 22 4"></polyline>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                </button>
                <button class="icon-btn" type="button" title="Notifications">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </button>
                <div th:replace="~{fragments/profile-dropdown :: staff-profile-dropdown}"></div>
            </div>
        </div>
    </nav>
</body>
</html>
