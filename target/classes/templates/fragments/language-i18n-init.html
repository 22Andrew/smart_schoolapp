<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
    <th:block th:fragment="language-i18n-init">
        <script th:inline="javascript">
            window.__ACTIVE_LANG__ = /*[[${activeLanguage != null ? activeLanguage.shortCode : 'en'}]]*/ 'en';
            window.__ACTIVE_RTL__ = /*[[${activeLanguage != null ? activeLanguage.isRtl : false}]]*/ false;
            window.__PHRASE_VERSION__ = /*[[${phraseCatalogVersion}]]*/ 1;
            (function preloadUiPhrases() {
                var code = String(window.__ACTIVE_LANG__ || 'en').toLowerCase();
                if (code === 'en') {
                    return;
                }
                try {
                    var cacheKey = 'smart_school_phrases_' + code + '_' + (window.__PHRASE_VERSION__ || 0);
                    var raw = sessionStorage.getItem(cacheKey);
                    if (raw) {
                        window.__UI_PHRASES__ = JSON.parse(raw);
                    }
                } catch (error) {
                    /* ignore invalid cache */
                }
            })();
        </script>
        <script th:src="@{/js/language-i18n.js(v=20260901-1)}"></script>
    </th:block>
</body>
</html>
