<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{fragments/user-layout :: layout(~{::title}, ~{::#user-applyleave-page})}">
<head>
    <title th:text="|${schoolName} - Leave List|">Mount Carmel School - Leave List</title>
</head>
<body>
<div id="user-applyleave-page" class="ual-page ugm-page uhw-page">
    <link rel="stylesheet" th:href="@{/css/user-gmeet.css}">
    <link rel="stylesheet" th:href="@{/css/user-homework.css}">
    <link rel="stylesheet" th:href="@{/css/user-applyleave.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <div class="ugm-card">
        <div class="uhw-header">
            <h1 class="ugm-title">Leave List</h1>
            <button type="button" class="ual-add-btn" id="ualAddBtn">+ Add</button>
        </div>

        <div class="ugm-toolbar">
            <div class="ugm-search">
                <input type="text" id="ualSearchInput" class="ugm-search-input" placeholder="Search" autocomplete="off">
            </div>
            <div class="ugm-toolbar-right">
                <select class="ugm-entries-select" id="ualEntriesSelect" aria-label="Rows per page">
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50" selected>50</option>
                    <option value="100">100</option>
                </select>
                <div class="ugm-actions table-actions">
                    <button type="button" class="icon-action-btn" id="ualCopyBtn" title="Copy">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                    <button type="button" class="icon-action-btn" id="ualExcelBtn" title="Excel">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                    </button>
                    <button type="button" class="icon-action-btn" id="ualCsvBtn" title="CSV">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                    </button>
                    <button type="button" class="icon-action-btn" id="ualPdfBtn" title="PDF">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M10 12h4"></path><path d="M10 16h4"></path></svg>
                    </button>
                    <button type="button" class="icon-action-btn" id="ualPrintBtn" title="Print">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                    </button>
                    <div class="column-visibility-wrap ugm-colvis-wrap">
                        <button type="button" class="icon-action-btn" id="ualColumnsBtn" title="Column Visibility">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                        </button>
                        <div class="column-visibility-dropdown" id="ualColumnsDropdown">
                            <div class="dropdown-header"><span>Toggle Columns</span></div>
                            <div class="dropdown-content">
                                <label class="column-toggle-item"><input type="checkbox" class="ual-column-toggle" data-column="0" checked><span>Class</span></label>
                                <label class="column-toggle-item"><input type="checkbox" class="ual-column-toggle" data-column="1" checked><span>Section</span></label>
                                <label class="column-toggle-item"><input type="checkbox" class="ual-column-toggle" data-column="2" checked><span>Apply Date</span></label>
                                <label class="column-toggle-item"><input type="checkbox" class="ual-column-toggle" data-column="3" checked><span>From Date</span></label>
                                <label class="column-toggle-item"><input type="checkbox" class="ual-column-toggle" data-column="4" checked><span>To Date</span></label>
                                <label class="column-toggle-item"><input type="checkbox" class="ual-column-toggle" data-column="5" checked><span>Reason</span></label>
                                <label class="column-toggle-item"><input type="checkbox" class="ual-column-toggle" data-column="6" checked><span>Status</span></label>
                                <label class="column-toggle-item"><input type="checkbox" class="ual-column-toggle" data-column="7" checked><span>Action</span></label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="ugm-table-wrap">
            <table class="ugm-table data-table" id="ualTable">
                <thead>
                    <tr>
                        <th data-sort="className">Class <span class="sort-icon">↕</span></th>
                        <th data-sort="section">Section <span class="sort-icon">↕</span></th>
                        <th data-sort="applyDate">Apply Date <span class="sort-icon">↕</span></th>
                        <th data-sort="fromDate">From Date <span class="sort-icon">↕</span></th>
                        <th data-sort="toDate">To Date <span class="sort-icon">↕</span></th>
                        <th data-sort="reason">Reason <span class="sort-icon">↕</span></th>
                        <th data-sort="statusDisplay">Status <span class="sort-icon">↕</span></th>
                        <th class="ugm-col-center">Action</th>
                    </tr>
                </thead>
                <tbody id="ualTableBody">
                    <tr class="ugm-empty-row">
                        <td colspan="8">Loading leave list...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="ugm-footer">
            <div class="ugm-showing" id="ualShowingInfo">Showing 0 to 0 of 0 entries</div>
            <div class="ugm-pagination" id="ualPagination"></div>
        </div>
    </div>

    <div class="uhw-modal ual-modal" id="ualModal" hidden>
        <div class="uhw-modal-overlay" id="ualModalOverlay"></div>
        <div class="uhw-modal-dialog ual-dialog" role="dialog" aria-modal="true" aria-labelledby="ualModalTitle">
            <div class="uhw-modal-header">
                <h2 id="ualModalTitle">Add Leave</h2>
                <button type="button" class="uhw-modal-close" id="ualModalClose" aria-label="Close">&times;</button>
            </div>
            <form class="ual-form" id="ualForm">
                <div class="uhw-field">
                    <label for="ualApplyDate">Apply Date <span class="required">*</span></label>
                    <input type="date" id="ualApplyDate" class="ual-input" required>
                </div>
                <div class="ual-date-row">
                    <div class="uhw-field">
                        <label for="ualFromDate">From Date <span class="required">*</span></label>
                        <input type="date" id="ualFromDate" class="ual-input" required>
                    </div>
                    <div class="uhw-field">
                        <label for="ualToDate">To Date <span class="required">*</span></label>
                        <input type="date" id="ualToDate" class="ual-input" required>
                    </div>
                </div>
                <div class="uhw-field">
                    <label for="ualReason">Reason</label>
                    <textarea id="ualReason" class="uhw-textarea ual-reason" rows="4"></textarea>
                </div>
                <div class="uhw-field">
                    <label>Attach Document</label>
                    <label class="uhw-dropzone" id="ualDropzone" for="ualDocument">
                        <input type="file" id="ualDocument" class="uhw-file-input">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="16 16 12 12 8 16"></polyline>
                            <line x1="12" y1="12" x2="12" y2="21"></line>
                            <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path>
                        </svg>
                        <span id="ualDropzoneText">Drag and drop a file here or click</span>
                    </label>
                </div>
                <div class="ual-form-footer">
                    <button type="submit" class="uhw-save-btn" id="ualSaveBtn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script th:src="@{/js/user-applyleave.js}"></script>
</div>
</body>
</html>
