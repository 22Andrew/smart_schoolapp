<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{fragments/user-layout :: layout(~{::title}, ~{::#user-getfees-page})}">
<head>
    <title th:text="|${schoolName} - Student Fees|">Mount Carmel School - Student Fees</title>
</head>
<body>
<div id="user-getfees-page" class="ugf-page">
    <link rel="stylesheet" th:href="@{/css/user-getfees.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <input type="hidden" id="feeStudentId" th:value="${feeStudentId}">
    <input type="hidden" id="feeSessionYear" th:value="${feeSessionYear}">

    <div class="ugf-header">
        <h1 class="ugf-title">Student Fees</h1>
        <a th:href="@{/user/user/dashboard}" class="ugf-back-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back
        </a>
    </div>

    <div class="ugf-student-card">
        <div class="ugf-student-photo">
            <div class="ugf-photo-placeholder" th:replace="~{fragments/profile-photo-placeholder :: placeholder}"></div>
        </div>
        <div class="ugf-student-grid">
            <div class="ugf-detail-col">
                <div class="ugf-detail-row"><span class="ugf-label">Name</span><span class="ugf-value" id="feeStudentName" th:text="${studentName}">Edward Thomas</span></div>
                <div class="ugf-detail-row"><span class="ugf-label">Father Name</span><span class="ugf-value" id="feeFatherName" th:text="${feeFatherName}">Olivier Thomas</span></div>
                <div class="ugf-detail-row"><span class="ugf-label">Mobile Number</span><span class="ugf-value" id="feeMobileNumber" th:text="${feeMobileNumber}">98262573272</span></div>
                <div class="ugf-detail-row"><span class="ugf-label">Category</span><span class="ugf-value" id="feeCategory" th:text="${feeCategory}">OBC</span></div>
            </div>
            <div class="ugf-detail-col">
                <div class="ugf-detail-row"><span class="ugf-label">Class (Section)</span><span class="ugf-value" id="feeClassSection" th:text="${feeClassSection}">Class 1 (A)</span></div>
                <div class="ugf-detail-row"><span class="ugf-label">Admission No</span><span class="ugf-value" id="feeAdmissionNo" th:text="${admissionNo}">1800011</span></div>
                <div class="ugf-detail-row"><span class="ugf-label">Roll Number</span><span class="ugf-value" id="feeRollNumber" th:text="${feeRollNumber}">001</span></div>
                <div class="ugf-detail-row"><span class="ugf-label">RTE</span><span class="ugf-value ugf-rte" id="feeRte" th:text="${feeRte}">No</span></div>
            </div>
        </div>
    </div>

    <div class="ugf-action-bar">
        <div class="ugf-action-buttons">
            <button type="button" class="ugf-btn ugf-btn-print" id="printSelectedBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 6 2 18 2 18 9"></polyline>
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                    <rect x="6" y="14" width="12" height="8"></rect>
                </svg>
                Print Selected
            </button>
        </div>
        <div class="ugf-session-text">Session : <span id="feeSessionLabel" th:text="${feeSessionYear}">2026-27</span></div>
        <div class="ugf-date-text">Date: <span id="feeDateLabel"></span></div>
    </div>

    <div class="ugf-table-card">
        <div class="ugf-table-toolbar table-controls">
            <div class="ugf-table-actions table-actions">
                <button type="button" class="icon-action-btn" id="copyBtn" title="Copy">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
                <button type="button" class="icon-action-btn" id="excelBtn" title="Excel">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                </button>
                <button type="button" class="icon-action-btn" id="csvBtn" title="CSV">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                </button>
                <button type="button" class="icon-action-btn" id="pdfBtn" title="PDF">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                </button>
                <button type="button" class="icon-action-btn" id="printTableBtn" title="Print">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                </button>
            </div>
        </div>

        <div class="ugf-table-wrap">
            <table class="ugf-fees-table" id="userFeesTable">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAllFees" aria-label="Select all fees"></th>
                        <th>Fees</th>
                        <th>Due Date</th>
                        <th>Status</th>
                        <th>Amount ($)</th>
                        <th>Payment ID</th>
                        <th>Mode</th>
                        <th>Date</th>
                        <th>Discount ($)</th>
                        <th>Fine ($)</th>
                        <th>Paid ($)</th>
                        <th>Balance ($)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="userFeesTableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:src="@{/js/user-getfees.js}"></script>
</div>
</body>
</html>
