<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Human Resource Report - Smart School</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/humanresource-report.css}">
    <link rel="stylesheet" th:href="@{/css/app-theme.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <nav th:replace="~{fragments/top-navbar :: top-navbar}"></nav>

    <div class="main-container">
        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <main class="main-content hr-report-page" id="hrReportRoot"
              th:attr="data-report-key=${reportKey},data-api-url=${apiUrl},data-active-nav=${activeNav},data-list-title=${listTitle}">
            <div class="hr-report-panel">
                <div class="hr-report-header">
                    <h2 class="hr-report-title">Human Resource Report</h2>
                </div>

                <div class="hr-report-nav-grid">
                    <div class="hr-report-nav-col">
                        <a href="/report/staffreport"
                           class="hr-report-nav-item"
                           th:classappend="${activeNav == 'staff'} ? ' active'">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                            Staff Report
                        </a>
                        <a href="/report/myleaverequestreport"
                           class="hr-report-nav-item"
                           th:classappend="${activeNav == 'myleave'} ? ' active'">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                            My Leave Request Report
                        </a>
                    </div>
                    <div class="hr-report-nav-col">
                        <a href="/admin/report/payrollreport"
                           class="hr-report-nav-item"
                           th:classappend="${activeNav == 'payroll'} ? ' active'">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                            Payroll Report
                        </a>
                    </div>
                    <div class="hr-report-nav-col">
                        <a href="/report/leavereaport"
                           class="hr-report-nav-item"
                           th:classappend="${activeNav == 'leave'} ? ' active'">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                            Leave Request Report
                        </a>
                    </div>
                </div>

                <div class="hr-criteria-panel">
                    <h3 class="criteria-heading">Select Criteria</h3>
                    <form class="hr-criteria-form" id="hrCriteriaForm">
                        <div class="hr-criteria-grid hr-criteria-grid--staff" id="staffCriteria" th:classappend="${activeNav != 'staff'} ? ' hidden'">
                            <div class="form-group">
                                <label for="searchTypeBySelect">Search Type By (Date Of Joining)</label>
                                <select id="searchTypeBySelect" class="form-select">
                                    <option value="">Select</option>
                                    <option value="today">Today</option>
                                    <option value="this_week">This Week</option>
                                    <option value="this_month">This Month</option>
                                    <option value="this_year">This Year</option>
                                    <option value="last_month">Last Month</option>
                                    <option value="all">All</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="staffStatusSelect">Status</label>
                                <select id="staffStatusSelect" class="form-select">
                                    <option value="">Select</option>
                                    <option value="Active" selected>Active</option>
                                    <option value="Inactive">Inactive</option>
                                    <option value="All">All</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="staffRoleSelect">Role</label>
                                <select id="staffRoleSelect" class="form-select">
                                    <option value="">Select</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="designationSelect">Designation</label>
                                <select id="designationSelect" class="form-select">
                                    <option value="">Select</option>
                                </select>
                            </div>
                        </div>

                        <div class="hr-criteria-grid hr-criteria-grid--three" id="payrollCriteria" th:classappend="${activeNav != 'payroll'} ? ' hidden'">
                            <div class="form-group">
                                <label for="payrollRoleSelect">Role</label>
                                <select id="payrollRoleSelect" class="form-select">
                                    <option value="">Select</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="payrollMonthSelect">Month</label>
                                <select id="payrollMonthSelect" class="form-select">
                                    <option value="">Select</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="payrollYearSelect">Year <span class="required">*</span></label>
                                <select id="payrollYearSelect" class="form-select">
                                    <option value="">Select</option>
                                </select>
                            </div>
                        </div>

                        <div class="hr-criteria-grid hr-criteria-grid--five" id="leaveCriteria" th:classappend="${activeNav != 'leave'} ? ' hidden'">
                            <div class="form-group">
                                <label for="leaveFromDate">From Date</label>
                                <input type="date" id="leaveFromDate" class="form-input">
                            </div>
                            <div class="form-group">
                                <label for="leaveToDate">To Date</label>
                                <input type="date" id="leaveToDate" class="form-input">
                            </div>
                            <div class="form-group">
                                <label for="leaveJoiningDate">Date Of Joining</label>
                                <input type="date" id="leaveJoiningDate" class="form-input">
                            </div>
                            <div class="form-group">
                                <label for="leaveStaffSelect">Staff Name</label>
                                <select id="leaveStaffSelect" class="form-select">
                                    <option value="">Select</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="leaveStatusSelect">Status</label>
                                <select id="leaveStatusSelect" class="form-select">
                                    <option value="">Select</option>
                                    <option value="Approved">Approved</option>
                                    <option value="Pending">Pending</option>
                                    <option value="Disapproved">Disapproved</option>
                                </select>
                            </div>
                        </div>

                        <div class="hr-criteria-grid hr-criteria-grid--three" id="myLeaveCriteria" th:classappend="${activeNav != 'myleave'} ? ' hidden'">
                            <div class="form-group">
                                <label for="myLeaveFromDate">From Date</label>
                                <input type="date" id="myLeaveFromDate" class="form-input">
                            </div>
                            <div class="form-group">
                                <label for="myLeaveToDate">To Date</label>
                                <input type="date" id="myLeaveToDate" class="form-input">
                            </div>
                            <div class="form-group">
                                <label for="myLeaveStatusSelect">Status</label>
                                <select id="myLeaveStatusSelect" class="form-select">
                                    <option value="">Select</option>
                                    <option value="Approved">Approved</option>
                                    <option value="Pending">Pending</option>
                                    <option value="Disapproved">Disapproved</option>
                                </select>
                            </div>
                        </div>

                        <div class="hr-criteria-actions">
                            <button type="submit" class="btn-search" id="searchBtn">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <path d="m21 21-4.35-4.35"></path>
                                </svg>
                                Search
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="hr-results-panel" id="resultsPanel">
                <h3 class="results-heading" id="resultsHeading" th:text="${listTitle}">Staff Report</h3>
                <div class="table-controls">
                    <div class="table-search">
                        <input type="text" id="tableSearchInput" class="table-search-input" placeholder="Search">
                    </div>
                    <div class="table-actions">
                        <select class="entries-select" id="entriesSelect">
                            <option value="10">10</option>
                            <option value="25">25</option>
                            <option value="50" selected>50</option>
                            <option value="100">100</option>
                        </select>
                        <button type="button" class="icon-action-btn" id="copyBtn" title="Copy">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                        <button type="button" class="icon-action-btn" id="excelBtn" title="Excel">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                        </button>
                        <button type="button" class="icon-action-btn" id="csvBtn" title="CSV">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                        </button>
                        <button type="button" class="icon-action-btn" id="pdfBtn" title="PDF">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                        </button>
                        <button type="button" class="icon-action-btn" id="printBtn" title="Print">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                                <rect x="6" y="14" width="12" height="8"></rect>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="hr-report-table" id="reportTable">
                        <thead id="reportTableHead"></thead>
                        <tbody id="reportTableBody">
                            <tr class="empty-row">
                                <td colspan="8">
                                    <div class="empty-state">
                                        <p class="empty-message">No data available in table</p>
                                        <div class="empty-illustration" aria-hidden="true">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                                            </svg>
                                        </div>
                                        <p class="empty-hint">← Add new record or search with different criteria.</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="table-footer">
                    <div class="showing-info" id="showingInfo">Showing 0 to 0 of 0 entries</div>
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/dashboard.js}"></script>
    <script th:src="@{/js/humanresource-report.js}"></script>
</body>
</html>
