# App Name
spring.application.name=smart_schoolapp
app.version=0.0.1-SNAPSHOT

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/smart_schoolapp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=22Andrew@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.type.preferred_java_type_jdbc_type_code=12

# Student photo uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-part-count=200
server.tomcat.max-parameter-count=10000
app.upload.dir=uploads

# Database bootstrap: restores bundled SQL backup (211 tables, Smart School operational data).
# Modes: off | auto (default) | force
# auto also restores when too many tables are still empty (bootstrap-if-incomplete=true).
app.database.bootstrap-from-backup=auto
app.database.bootstrap-backup-file=db_ver_7.1.0_2026-08-21_12-25-41.sql
app.database.bootstrap-if-incomplete=true
app.database.incomplete-table-threshold-percent=12

# Static assets (CSS/JS/images) - fallback to source folder during local IDE runs
spring.web.resources.static-locations=classpath:/static/,file:./src/main/resources/static/